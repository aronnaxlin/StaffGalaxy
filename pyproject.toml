[project]
name = "staff-galaxy"
version = "0.1.0"
description = "Staff Galaxy: a Neo4j knowledge graph of Bangumi Archive anime staff collaboration."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "leidenalg>=0.10.0",
  "neo4j>=5.26.0",
  "neo4j-rust-ext>=5.26.0",
  "numpy>=2.0.0",
  "python-igraph>=0.11.0",
  "scipy>=1.11.0",
  "PyYAML>=6.0.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["staff_galaxy*"]

[project.optional-dependencies]
dev = []

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

services:
  neo4j:
    image: neo4j:5-community
    container_name: animedna-neo4j
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G
    volumes:
      - ./data/processed/neo4j/data:/data
      - ./data/processed/neo4j/logs:/logs
      - ./data/processed/neo4j/import:/import
      - ./data/processed/neo4j/plugins:/plugins

  # Throwaway instance for the test suite (tests wipe it): docker compose --profile test up -d
  neo4j-test:
    image: neo4j:5-community
    container_name: animedna-neo4j-test
    profiles: ["test"]
    ports:
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/staff-galaxy-test
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256M
    tmpfs:
      - /data
